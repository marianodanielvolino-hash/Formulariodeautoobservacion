<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Relevamiento</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width: 1000px;">
        <!-- Sección de Login -->
        <div id="loginSection">
            <header>
                <h1>Acceso a Administración</h1>
            </header>
            <div class="form-group">
                <label for="adminToken">Token de Acceso</label>
                <input type="password" id="adminToken" placeholder="Ingrese el token de seguridad">
            </div>
            <button id="loginBtn" class="btn-primary">Ingresar</button>
            <div id="loginError" class="status-message error" style="margin-top: 1rem;"></div>
        </div>

        <!-- Panel Principal (oculto por defecto) -->
        <div id="adminPanel" style="display: none;">
            <div class="admin-header">
                <h2>Respuestas de Relevamiento</h2>
                <div class="header-actions">
                    <button id="exportBtn" class="btn-secondary">Exportar a JSON</button>
                    <button id="logoutBtn" class="btn-secondary">Cerrar Sesión</button>
                </div>
            </div>

            <div id="respuestasLista" class="respuestas-grid">
                <!-- Las respuestas se cargarán aquí -->
                <p>Cargando respuestas...</p>
            </div>
        </div>
    </div>

    <!-- Modal para ver detalles (Simplificado con alert o dialog nativo en JS) -->
    
    <script src="js/admin.js"></script>
</body>
</html>
